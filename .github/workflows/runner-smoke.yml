name: Runner Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, linux] # 追加ラベルを付けた場合はそこに合わせて調整
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          whoami
          pwd
          node -v || true
          npm -v || true
          go version || true
