name: Check Runner User and Sudo

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Check user, host, and environment
        shell: bash
        run: |
          echo "=== User & Host ==="
          whoami
          id
          hostname
          uname -a

          echo "=== Key Environment Variables ==="
          echo "USER=${USER:-}"
          echo "LOGNAME=${LOGNAME:-}"
          echo "HOME=${HOME:-}"
          echo "SUDO_ASKPASS=${SUDO_ASKPASS:-}"
          echo "SSH_CONNECTION=${SSH_CONNECTION:-}"
          echo "PATH=${PATH:-}"

      - name: Check sudoers rules
        shell: bash
        run: |
          echo "=== sudo -l ==="
          sudo -l || true

      - name: Check non-interactive sudo with systemctl
        shell: bash
        run: |
          echo "=== sudo -n systemctl is-active ==="
          sudo -n systemctl is-active --quiet www-bbs-api.service && echo "www-bbs-api.service is active"

          echo "=== sudo -n systemctl restart (dry check via -n) ==="
          sudo -n /usr/bin/systemctl restart www-bbs-api.service
          sudo -n /usr/bin/systemctl is-active --quiet www-bbs-api.service
