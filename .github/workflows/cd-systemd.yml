name: CD - Restart systemd

on:
  workflow_run:
    workflows:
      - "CI - Hono API"
      - "CI - React"
    branches: [ main ]
    types:
      - completed

concurrency:
  group: cd-systemd-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, hono]
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success'
      }}

    steps:
      - name: Checkout repository at commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare build artifacts
        run: |
          npm ci
          npm run build

      - name: Restart systemd services
        run: |
          systemctl is-active --quiet www-bbs-api.service && echo "www-bbs-api.service is active"
          sudo -n /usr/bin/systemctl restart www-bbs-api.service
          systemctl is-active --quiet www-bbs-api.service
