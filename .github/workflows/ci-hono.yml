name: CI - Hono API

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'

jobs:
  test-and-build:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm run typecheck
          npm test:react

      - name: Build
        run: npm run build
