name: CI - React

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!server/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!server/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Test
        run: |
          npm run typecheck
          npm run test:react

      - name: Build
        run: npm run build
