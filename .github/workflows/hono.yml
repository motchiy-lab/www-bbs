name: Hono

on:
  push:
    branches: [ main ]
    paths:
      - "server/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ main ]
    paths:
      - "server/**"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:hono

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: [ test, build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hono]

    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
      SERVICE_NAME: www-bbs-api.service

    steps:
      - name: Pull, build, and restart the systemd service
        shell: bash
        run: |
          set -euo pipefail

          service_dir="$(systemctl show --property=WorkingDirectory --value "$SERVICE_NAME")"
          if [[ -z "$service_dir" || ! -d "$service_dir" ]]; then
            echo "$SERVICE_NAME must have a valid WorkingDirectory inside the deployed repository."
            exit 1
          fi

          repo_dir="$(git -C "$service_dir" rev-parse --show-toplevel)"
          if ! git -C "$repo_dir" remote get-url origin | grep -Fq "$GITHUB_REPOSITORY"; then
            echo "The service repository's origin does not match $GITHUB_REPOSITORY."
            exit 1
          fi

          git -C "$repo_dir" fetch --no-tags origin "$DEPLOY_BRANCH"
          fetched_sha="$(git -C "$repo_dir" rev-parse FETCH_HEAD)"
          if [[ "$fetched_sha" != "$DEPLOY_SHA" ]]; then
            echo "Skipping stale deployment for $DEPLOY_SHA; origin/$DEPLOY_BRANCH is now $fetched_sha."
            exit 0
          fi

          git -C "$repo_dir" pull --ff-only origin "$DEPLOY_BRANCH"
          deployed_sha="$(git -C "$repo_dir" rev-parse HEAD)"
          if [[ "$deployed_sha" != "$DEPLOY_SHA" ]]; then
            echo "Expected $DEPLOY_SHA after pull, but found $deployed_sha."
            exit 1
          fi

          cd "$repo_dir"
          npm ci
          npm run build

          systemctl is-active --quiet "$SERVICE_NAME" && echo "$SERVICE_NAME is active"
          sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"
          systemctl is-active --quiet "$SERVICE_NAME"
