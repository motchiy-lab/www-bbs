name: Hono

on:
  push:
    branches: [ main ]
    paths:
      - "server/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ main ]
    paths:
      - "server/**"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:hono

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: [ test, build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hono]

    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
      SERVICE_NAME: www-bbs-api.service

    steps:
      - name: Locate deployed repository
        id: repository
        shell: bash
        run: |
          set -euo pipefail

          service_dir="$(systemctl show --property=WorkingDirectory --value "$SERVICE_NAME")"
          if [[ -z "$service_dir" || ! -d "$service_dir" ]]; then
            echo "$SERVICE_NAME must have a valid WorkingDirectory inside the deployed repository."
            exit 1
          fi

          repo_dir="$(git -C "$service_dir" rev-parse --show-toplevel)"
          echo "repo_dir=$repo_dir" >> "$GITHUB_OUTPUT"

      - name: Verify repository origin
        env:
          REPO_DIR: ${{ steps.repository.outputs.repo_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if ! git -C "$REPO_DIR" remote get-url origin | grep -Fq "$GITHUB_REPOSITORY"; then
            echo "The service repository's origin does not match $GITHUB_REPOSITORY."
            exit 1
          fi

      - name: Fetch deployment branch
        env:
          REPO_DIR: ${{ steps.repository.outputs.repo_dir }}
        run: git -C "$REPO_DIR" fetch --no-tags origin "$DEPLOY_BRANCH"

      - name: Check for stale deployment
        id: deployment
        env:
          REPO_DIR: ${{ steps.repository.outputs.repo_dir }}
        shell: bash
        run: |
          set -euo pipefail

          fetched_sha="$(git -C "$REPO_DIR" rev-parse FETCH_HEAD)"
          if [[ "$fetched_sha" != "$DEPLOY_SHA" ]]; then
            echo "Skipping stale deployment for $DEPLOY_SHA; origin/$DEPLOY_BRANCH is now $fetched_sha."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Update deployed repository
        if: steps.deployment.outputs.current == 'true'
        env:
          REPO_DIR: ${{ steps.repository.outputs.repo_dir }}
        shell: bash
        run: |
          set -euo pipefail

          git -C "$REPO_DIR" pull --ff-only origin "$DEPLOY_BRANCH"
          deployed_sha="$(git -C "$REPO_DIR" rev-parse HEAD)"
          if [[ "$deployed_sha" != "$DEPLOY_SHA" ]]; then
            echo "Expected $DEPLOY_SHA after pull, but found $deployed_sha."
            exit 1
          fi

      - name: Install dependencies
        if: steps.deployment.outputs.current == 'true'
        run: npm ci
        working-directory: ${{ steps.repository.outputs.repo_dir }}

      - name: Build
        if: steps.deployment.outputs.current == 'true'
        run: npm run build
        working-directory: ${{ steps.repository.outputs.repo_dir }}

      - name: Restart service
        if: steps.deployment.outputs.current == 'true'
        run: sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"

      - name: Verify service is active
        if: steps.deployment.outputs.current == 'true'
        run: systemctl is-active --quiet "$SERVICE_NAME"
